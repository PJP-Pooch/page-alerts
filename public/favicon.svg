<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Squircle -->
  <rect width="64" height="64" rx="16" fill="#0b0f19" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Lightning Bolt Symbol -->
  <polygon points="35 6 11 34 31 34 29 58 53 30 33 30 35 6" 
           fill="url(#brand-grad)" 
           filter="url(#glow)" />
</svg>
